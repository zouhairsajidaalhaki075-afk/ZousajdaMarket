<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZousajdaMarket</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 0; padding: 0; direction: rtl;}
    header {background: #2c3e50; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center;}
    nav button {background: white; color: #2c3e50; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 5px;}
    section {padding: 2rem;}
    .products {display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;}
    .product {border: 1px solid #ccc; padding: 1rem; border-radius: 8px; text-align: center;}
    footer {background: #2c3e50; color: white; text-align: center; padding: 1rem; margin-top: 2rem;}
  </style>
</head>
<body>
  <header>
    <h1>ZousajdaMarket</h1>
    <nav>
      <button onclick="toggleLang()">Français</button>
    </nav>
  </header>

  <section id="intro">
    <h2>مرحبًا بكم في ZousajdaMarket</h2>
    <p>منصتكم لربط البائعين بالمشترين في المنتجات القديمة والجديدة.</p>
  </section>

  <section id="products">
    <h2>المنتجات</h2>
    <div class="products">
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>منتج 1</h3>
        <p>وصف قصير للمنتج.</p>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>منتج 2</h3>
        <p>وصف قصير للمنتج.</p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>اتصل بنا</h2>
    <form>
      <input type="text" placeholder="الاسم" required><br><br>
      <input type="email" placeholder="البريد الإلكتروني" required><br><br>
      <textarea placeholder="رسالتك" required></textarea><br><br>
      <button type="submit">إرسال</button>
    </form>
  </section>

  <footer>
    <p>© 2025 ZousajdaMarket. جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    let lang = 'ar';
    function toggleLang(){
      if(lang === 'ar'){
        document.documentElement.lang = 'fr';
        document.getElementById('intro').innerHTML = '<h2>Bienvenue sur ZousajdaMarket</h2><p>Votre plateforme pour connecter les vendeurs et les acheteurs de produits anciens et modernes.</p>';
        document.getElementById('products').querySelector('h2').textContent = 'Produits';
        document.getElementById('contact').querySelector('h2').textContent = 'Contactez-nous';
        document.querySelector('nav button').textContent = 'العربية';
        lang = 'fr';
      } else {
        document.documentElement.lang = 'ar';
        document.getElementById('intro').innerHTML = '<h2>مرحبًا بكم في ZousajdaMarket</h2><p>منصتكم لربط البائعين بالمشترين في المنتجات القديمة والجديدة.</p>';
        document.getElementById('products').querySelector('h2').textContent = 'المنتجات';
        document.getElementById('contact').querySelector('h2').textContent = 'اتصل بنا';
        document.querySelector('nav button').textContent = 'Français';
        lang = 'ar';
      }
    }
  </script>
</body>
</html>
